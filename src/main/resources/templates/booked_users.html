<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booked Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
        }
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="bi bi-people-fill text-primary"></i> Booked Users (Orders)</h2>
            <a href="/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>

        <div class="table-container">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>City</th>
                        <th>Order Details</th>
                        <th>Total Amount</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(bookedUsers)}">
                        <td colspan="9" class="text-center text-muted py-4">No bookings found.</td>
                    </tr>
                    <tr th:each="user : ${bookedUsers}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.firstName + ' ' + user.lastName}">John Doe</td>
                        <td th:text="${user.email}">john@example.com</td>
                        <td th:text="${user.phone}">1234567890</td>
                        <td th:text="${user.address}">123 Main St</td>
                        <td th:text="${user.city}">New York</td>
                        <td>
                            <small th:text="${user.orderDetails}">2x Apple</small>
                        </td>
                        <td th:text="${user.totalAmount != null ? '₹' + user.totalAmount : '-'}">₹100</td>
                        <td class="text-center">
                            <a th:href="'mailto:' + ${user.email} + '?subject=Regarding your Fruit Shop Order'" class="btn btn-sm btn-primary">
                                <i class="bi bi-envelope"></i> Reply
                            </a>
                            <a th:href="@{/admin/booked-users/delete/{id}(id=${user.id})}" 
                               class="btn btn-sm btn-danger ms-2"
                               onclick="return confirm('Are you sure you want to delete this booking?');">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
